<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">自動交易研究系統流程圖</title><desc id="desc">市場掃描與交易執行為獨立流程；掃描報告不會觸發交易下單。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#50758b"/></marker></defs><rect width="1000" height="800" fill="white"/><g font-family="Microsoft JhengHei, sans-serif" fill="#17394d"><text x="250" y="38" text-anchor="middle" font-size="25" font-weight="700">A｜跨市場掃描</text><text x="750" y="38" text-anchor="middle" font-size="25" font-weight="700">B｜交易執行模組</text><rect x="40" y="65" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="250.0" y="97" text-anchor="middle" font-size="21" font-weight="700">資料與候選名單</text><text x="250.0" y="124" text-anchor="middle" font-size="15">台股／美股／加密貨幣；非全市場掃描</text><path d="M250,147 L250,184" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="188" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="250.0" y="220" text-anchor="middle" font-size="21" font-weight="700">行情檢查與指標計算</text><text x="250.0" y="247" text-anchor="middle" font-size="15">收盤狀態、前高低、EMA、ATR、量比</text><path d="M250,270 L250,307" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="311" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="250.0" y="343" text-anchor="middle" font-size="21" font-weight="700">規則分類與原因說明</text><text x="250.0" y="370" text-anchor="middle" font-size="15">突破買進／回檔止穩／減碼／再觀察</text><path d="M250,393 L250,430" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="434" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="250.0" y="466" text-anchor="middle" font-size="21" font-weight="700">報告與人工評估</text><text x="250.0" y="493" text-anchor="middle" font-size="15">CSV、文字快照；加碼另確認持倉風險</text><rect x="540" y="65" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="750.0" y="97" text-anchor="middle" font-size="21" font-weight="700">交易行情與設定</text><text x="750.0" y="124" text-anchor="middle" font-size="15">Binance 期貨；測試網／正式盤入口</text><path d="M750,147 L750,184" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="540" y="188" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="750.0" y="220" text-anchor="middle" font-size="21" font-weight="700">EMA 趨勢與交叉訊號</text><text x="750.0" y="247" text-anchor="middle" font-size="15">方向一致才形成進場訊號</text><path d="M750,270 L750,307" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="540" y="311" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="750.0" y="343" text-anchor="middle" font-size="21" font-weight="700">部位計算與風險限制</text><text x="750.0" y="370" text-anchor="middle" font-size="15">資金、停損、費用及滑價預估</text><path d="M750,393 L750,430" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="540" y="434" width="420" height="82" rx="12" fill="#eaf1f6" stroke="#c5d5df"/><text x="750.0" y="466" text-anchor="middle" font-size="21" font-weight="700">條件成立時執行與追蹤</text><text x="750.0" y="493" text-anchor="middle" font-size="15">依交易設定送單；持倉與成交紀錄</text><path d="M500,65 L500,528" stroke="#c5d5df" stroke-dasharray="6 6"/><text x="500" y="557" text-anchor="middle" font-size="19" font-weight="700">掃描報告不會自動加入下單清單，也不會自動調倉</text><path d="M250,516 L250,598" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M750,516 L750,598" stroke="#50758b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="40" y="602" width="920" height="82" rx="12" fill="#eef5ed" stroke="#c5d5df"/><text x="500.0" y="634" text-anchor="middle" font-size="21" font-weight="700">紀錄與驗證 → 規則修正</text><text x="500.0" y="661" text-anchor="middle" font-size="15">報告快照、單元測試、獨立回測工具；不把功能測試視為收益證明</text><text x="500" y="731" text-anchor="middle" font-size="17">已具備模組與測試；此圖不表示所有模組均已完成實盤績效驗證。</text></g></svg>